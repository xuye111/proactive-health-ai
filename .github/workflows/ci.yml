name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build

      - name: 规则桩评测
        run: npm run eval

      - name: 用户端闭环检查
        run: npm run check:v2
